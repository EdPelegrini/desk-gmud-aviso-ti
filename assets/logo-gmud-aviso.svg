<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aviso de GMUD aprovada">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B7F6B"/>
      <stop offset="1" stop-color="#0B4F6C"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#1FB57A"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#04283A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#fundo)"/>
  <circle cx="420" cy="92" r="150" fill="#FFFFFF" opacity="0.06"/>

  <!-- calendario -->
  <g filter="url(#sombra)">
    <rect x="92" y="132" width="328" height="300" rx="40" fill="#FFFFFF"/>
    <path d="M92 172a40 40 0 0 1 40-40h248a40 40 0 0 1 40 40v44H92z" fill="#0B4F6C"/>
    <rect x="156" y="98" width="30" height="64" rx="15" fill="#FFFFFF"/>
    <rect x="326" y="98" width="30" height="64" rx="15" fill="#FFFFFF"/>
    <rect x="164" y="104" width="14" height="52" rx="7" fill="#7FB8CC"/>
    <rect x="334" y="104" width="14" height="52" rx="7" fill="#7FB8CC"/>
  </g>

  <!-- linhas do calendario -->
  <g fill="#D5E4EA">
    <rect x="132" y="250" width="56" height="18" rx="9"/>
    <rect x="132" y="290" width="56" height="18" rx="9"/>
    <rect x="132" y="330" width="56" height="18" rx="9"/>
  </g>

  <!-- selo de aprovacao -->
  <circle cx="318" cy="332" r="86" fill="url(#check)"/>
  <circle cx="318" cy="332" r="86" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M276 334l30 30 56-64" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sino de alerta -->
  <g transform="translate(382 72)">
    <circle cx="40" cy="44" r="44" fill="#FFB547"/>
    <circle cx="40" cy="44" r="44" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M40 22c-10 0-17 8-17 18v9l-6 8h46l-6-8v-9c0-10-7-18-17-18z" fill="#FFFFFF"/>
    <circle cx="40" cy="64" r="6" fill="#FFFFFF"/>
    <rect x="37" y="14" width="6" height="9" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
